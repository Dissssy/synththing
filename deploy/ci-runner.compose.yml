# The self-hosted GitHub Actions runners the RUNNER repository variable
# names (see .github/workflows/ci.yml), pasted into Portainer as their own
# stack. ACCESS_TOKEN is set in the stack's environment variables, never
# here: a fine-grained token for Dissssy/synththing with only
# Administration: Read and write, which lets each container register
# itself on every start. Set RUNNER to synththing-runner.
#
# A runner takes one job at a time, so there's one per platform: builds of
# different platforms run side by side, two of the same one queue. Each has
# the shared label (for small jobs, any runner) and its platform's
# (synththing-runner-linux and so on, for builds).
#
# Every volume caches downloads or builds between runs, so the runners skip
# the GitHub cache (rust-cache, setup-gradle's cache) GitHub's runners use.
# Wiping one is always safe, it just refills on the next run. Each runner
# has its own build folder and toolchains (rustup has no locking, so two
# runners mustn't install into one at once); cargo's registry is shared,
# as cargo locks it.
x-runner: &runner
  # Ubuntu 22.04: Linux release builds need a glibc at least as new as the
  # one they're built against, so an older one runs on more systems.
  image: myoung34/github-runner:ubuntu-jammy
  restart: always

x-env: &env
  RUNNER_SCOPE: repo
  REPO_URL: https://github.com/Dissssy/synththing
  ACCESS_TOKEN: ${ACCESS_TOKEN}
  RUNNER_WORKDIR: /_work
  # Builds go here instead of the checkout's target/ (which checkout
  # wipes), so each build only redoes what changed.
  CARGO_TARGET_DIR: /root/target

services:
  runner-linux:
    <<: *runner
    environment:
      <<: *env
      RUNNER_NAME: ethan-docker-synththing-linux
      LABELS: synththing-runner,synththing-runner-linux
    volumes:
      - rustup-linux:/root/.rustup
      # cargo's registry, git checkouts and installed tools
      - cargo:/root/.cargo
      - target-linux:/root/target

  runner-windows:
    <<: *runner
    environment:
      <<: *env
      RUNNER_NAME: ethan-docker-synththing-windows
      LABELS: synththing-runner,synththing-runner-windows
    volumes:
      - rustup-windows:/root/.rustup
      - cargo:/root/.cargo
      - target-windows:/root/target
      # the MSVC CRT and Windows SDK cargo-xwin downloads
      - xwin:/root/.cache/cargo-xwin

  runner-android:
    <<: *runner
    environment:
      <<: *env
      RUNNER_NAME: ethan-docker-synththing-android
      LABELS: synththing-runner,synththing-runner-android
      # Where android-actions/setup-android installs the SDK and NDK.
      ANDROID_HOME: /root/android-sdk
    volumes:
      - rustup-android:/root/.rustup
      - cargo:/root/.cargo
      - target-android:/root/target
      # the Android SDK, NDK and licences
      - android-sdk:/root/android-sdk
      # Gradle's dependencies, the Android Gradle plugin and Gradle itself
      - gradle:/root/.gradle
      # JDKs from setup-java
      - toolcache:/opt/hostedtoolcache

volumes:
  rustup-linux:
  rustup-windows:
  rustup-android:
  cargo:
  target-linux:
  target-windows:
  target-android:
  xwin:
  android-sdk:
  gradle:
  toolcache:
