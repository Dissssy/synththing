# A synththing script library server from the published image
# (docs/DEPLOY.md). To build it yourself instead, use
# docker-compose.build.yml (the same, with a build: section).
#
# Its data (settings in server.json, its key, the database) is in ./data,
# made on first run: edit data/server.json then (behind_proxy, contact,
# name) and restart. For the internet, put a reverse proxy in front for
# HTTPS (Caddy, nginx, Traefik), pointed at port 7381.
#
# Admin commands: docker exec synththing synththing <command>

services:
  synththing:
    image: ghcr.io/dissssy/synththing:latest
    container_name: synththing
    restart: unless-stopped
    ports:
      - "7381:7381"
    volumes:
      - ./data:/data
    # (Watchtower, below, only updates containers with this label.)
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # To keep it up to date by itself: Watchtower pulls new releases of the
  # image and restarts the container (here, checking every 6 hours, and
  # only containers labelled as above). Uncomment to use it.
  #
  # watchtower:
  #   image: containrrr/watchtower
  #   container_name: watchtower
  #   restart: unless-stopped
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   command: --label-enable --cleanup --interval 21600
