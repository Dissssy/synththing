# Your hub (docs/HUB.md): a synththing device with no window that keeps
# every song, from the published image.
#
# To sign it in, put a link from a signed-in device (Preferences >
# Online Library > Sign in another device) in SYNTHTHING_PAIR_LINK below
# and start it:
#
#   docker compose -f hub.compose.yml up -d
#
# It signs in on its first start (the link works once, for 10 minutes,
# and is ignored once it's signed in). Without one it waits to be signed
# in: `docker attach synththing-hub` (or Portainer's Attach console),
# paste the link, then detach with Ctrl+P Ctrl+Q. Or:
# docker exec synththing-hub synththing hub pair '<link>'
#
# Its songs, playlists, settings and sign-in are in ./hub (songs in
# ./hub/music); its log is `docker logs synththing-hub` (and
# ./hub/synththing.log).

services:
  hub:
    image: ghcr.io/dissssy/synththing:latest
    container_name: synththing-hub
    restart: unless-stopped
    command: ["hub"]
    # (A terminal to paste a sign-in link into, with docker attach.)
    stdin_open: true
    tty: true
    environment:
      - SYNTHTHING_CONFIG_DIR=/data
      - SYNTHTHING_HUB_NAME=Home hub
      - SYNTHTHING_PAIR_LINK=
      # Its local API (docs/HUB.md), for programs let in with
      # `docker exec synththing-hub synththing hub token <name> --grant ...`:
      # true lets in other containers on its network.
      - SYNTHTHING_API_LAN=false
      # Where your devices reach it to send and take songs directly
      # (comma-separated, nearest first): this machine's address on your
      # network, and your public address if port 7390 is forwarded to it.
      # Without one, songs go through the relay only.
      - SYNTHTHING_HUB_URL=http://192.168.1.20:7390
    ports:
      - "7390:7390"
    volumes:
      - ./hub:/data
    # (Watchtower, as in docker-compose.yml, only updates containers with
    # this label.)
    labels:
      - com.centurylinklabs.watchtower.enable=true
