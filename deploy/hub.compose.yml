# Your hub (docs/HUB.md): a synththing device with no window that keeps
# every song, from the published image.
#
# To sign it in, put a link from a signed-in device (Preferences >
# Online Library > Sign in another device) in SYNTHTHING_PAIR_LINK below
# and start it:
#
#   docker compose -f hub.compose.yml up -d
#
# It signs in on its first start (the link works once, for 10 minutes,
# and is ignored once it's signed in). Without one it waits to be signed
# in with: docker exec synththing-hub synththing hub pair '<link>'
#
# Its songs, playlists, settings and sign-in are in ./hub (songs in
# ./hub/music); its log is `docker logs synththing-hub` (and
# ./hub/synththing.log).

services:
  hub:
    image: ghcr.io/dissssy/synththing:latest
    container_name: synththing-hub
    restart: unless-stopped
    command: ["hub"]
    environment:
      - SYNTHTHING_CONFIG_DIR=/data
      - SYNTHTHING_HUB_NAME=Home hub
      - SYNTHTHING_PAIR_LINK=
    volumes:
      - ./hub:/data
    # (Watchtower, as in docker-compose.yml, only updates containers with
    # this label.)
    labels:
      - com.centurylinklabs.watchtower.enable=true
