# cargo-release settings. `cargo release patch` (or minor/major) shows what
# it would do; add `--execute` to bump the version in Cargo.toml, commit,
# tag vX.Y.Z and push. The pushed tag triggers .github/workflows/release.yml,
# which builds the Windows exe and publishes the GitHub Release the in-app
# updater looks for.
publish = false
# The workspace (the Android crate, the vendored rustysynth) would make this one
# commit for all packages, where {{version}} has no single value.
consolidate-commits = false
allow-branch = ["master"]
tag-name = "v{{version}}"
pre-release-commit-message = "Release {{version}}"
# Before the release commit, with the new version in place: gathers
# changelog.d/ (every file but its README) into a new version section at
# the top of CHANGELOG.md, each group once (Added, Changed, Fixed, Removed,
# then any other), and deletes the files; the release commit (`git commit
# -a`) takes both. With nothing in changelog.d/ it stops here instead of
# releasing without notes. Plain sh and awk, so cutting a release builds
# nothing (CI tests the fragments' format on every push).
pre-release-hook = ["sh", "-c", '''
set -e
fragments=$(find changelog.d -maxdepth 1 -name '*.md' ! -name README.md | sort)
[ -n "$fragments" ] || { echo "changelog.d/ has nothing for $NEW_VERSION" >&2; exit 1; }
notes=$(mktemp)
awk '
  /^### / { group = substr($0, 5); if (!(group in body)) { order[++n] = group; body[group] = "" } next }
  NF { body[group] = body[group] $0 "\n" }
  function emit(g) { printf "\n### %s\n%s", g, body[g]; done[g] = 1 }
  END {
    split("Added Changed Fixed Removed", known, " ")
    for (i = 1; i <= 4; i++) if (known[i] in body) emit(known[i])
    for (i = 1; i <= n; i++) if (!(order[i] in done)) emit(order[i])
  }
' $fragments > "$notes"
awk -v head="## $NEW_VERSION ($(date -u +%F))" -v notes="$notes" '
  !added && /^## / { print head; while ((getline line < notes) > 0) print line; print ""; added = 1 }
  { print }
' CHANGELOG.md > CHANGELOG.md.new
mv CHANGELOG.md.new CHANGELOG.md
rm "$notes" $fragments
''']
tag-message = "Release {{version}}"
pre-release-replacements = [
  # src/lua_api.rs: what's new to scripts ships in this version (each entry's
  # `"next"`, after its section or `since:`; not the code that reads it).
  { file = "src/lua_api.rs", search = "([A-Z_]+, |since: )\"next\"", replace = "${1}\"{{version}}\"", min = 0 },
  # ...and the reference generated from it says so too.
  { file = "docs/scripting-reference.md", search = "\\(since next\\)", replace = "(since {{version}})", min = 0 },
]
