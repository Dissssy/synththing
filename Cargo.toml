[package]
name = "synththing"
version = "1.0.1"
edition = "2024"
publish = false
license = "WTFPL"

# The Android app's native library (android/), built with cargo-ndk.
[workspace]
members = [".", "android"]
default-members = ["."]

[dependencies]
# Vendored copy of rustysynth 1.3.6 with local patches: repairing (instead of
# rejecting) soundfonts with out-of-range sample/loop points, channel muting
# and note inspection in the sequencer, copying channel state between
# synthesizers, and Clone on the synthesizer (snapshots to re-render from). Search vendor/rustysynth/src for "LOCAL PATCH".
rustysynth = { path = "vendor/rustysynth" }
rodio = { version = "0.22.2", features = ["playback"] } # Safe cross-platform audio playback
anyhow = "1.0.104"
directories = "6.0.0"                                   # cross-platform config dir
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rustfft = "6.4.1"
mlua = { version = "0.12.1", features = ["lua54", "vendored"] }
egui_dock = { version = "0.21.1", features = ["serde"] }      # dockable, rearrangeable tab layout
ureq = { version = "3.4", features = ["json"] }            # HTTPS for update checks/downloads
semver = "1.0"                                            # comparing release versions
self-replace = "1.5"                                      # swapping the running exe on update
sha2 = "0.11"                                             # verifying downloaded updates
log = "0.4"                                               # app-wide log (applog.rs)
notify = "8"                                              # live-refresh watched folders (watch.rs)
symphonia = { version = "0.5.5", default-features = false, features = ["alac", "adpcm", "aiff", "caf", "mkv", "mpa"] } # song info (song_info.rs); the same copy rodio uses, so these formats reach playback too
clap = { version = "4.6", features = ["derive"] }         # command-line arguments (cli.rs)
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }  # unpacking a downloaded ffmpeg (ffmpeg.rs)
stylua = { version = "2.5.2", default-features = false, features = ["lua54"] }
full_moon = { version = "2.2", default-features = false, features = ["lua54"] }
gilrs = "0.11"
tiny_http = "0.12"
rusqlite = { version = "0.40.2", features = ["bundled"] }
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
qrcode = { version = "0.14", default-features = false }  # the sign-in code another device scans (app/pairing.rs)
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
png = "0.18"                                              # script previews (preview.rs)
egui_commonmark = "0.25"                                  # library servers' documents (EULA, privacy policy), as Markdown
egui-phosphor = "0.14"
base64 = "0.23"                                           # sealed sync blobs (library/sync.rs)
resvg = { version = "0.45", default-features = false }      # the wordmark in the menu bar (app/branding.rs)                                    # icons (the Phosphor set, as a font)
fontdb = "0.24"                                           # finding installed fonts to fall back on (app/fonts.rs)
skrifa = "0.44"                                           # reading which characters a font has; the same copy egui renders with
# The profiler overlay (app/profiler.rs). Pinned to a commit: the release on
# crates.io is still on egui 0.33.
puffin = { git = "https://github.com/EmbarkStudios/puffin", rev = "c81e9bb5e3839f516f3e56fe2d9e9649b5bdea86" }
puffin_egui = { git = "https://github.com/EmbarkStudios/puffin", rev = "c81e9bb5e3839f516f3e56fe2d9e9649b5bdea86" }

# The GUI framework (re-exports egui): on the desktop with its defaults, on
# Android with the native-activity backend and what that allows (not
# accesskit, which needs the game-activity one).
[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = "0.36.1"
rfd = "0.15"                                              # native file and folder dialogs
gethostname = "1.1"                                       # the default name of this device, for sign-ins (device.rs)

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["android-native-activity", "default_fonts", "links", "wgpu"] }
android-activity = "0.6"                                  # the AndroidApp eframe runs in (android.rs)
jni = "0.21"                                              # calling the app's Java side (android.rs)

[build-dependencies]
resvg = { version = "0.45", default-features = false }      # the app icon, from assets/synththing-icon.svg
png = "0.18"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"                                         # the icon, embedded in the .exe

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.24", default-features = false }  # the notification-area icon (tray.rs)
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_SystemInformation"] }  # re-attach to the terminal for CLI use; local time for recording names
