[package]
name = "synththing"
version = "0.1.0"
edition = "2024"

[dependencies]
# Vendored copy of rustysynth 1.3.6 with a local patch that repairs (instead of
# rejecting) soundfonts with out-of-range sample/loop points. See
# vendor/rustysynth/src/soundfont.rs (search "LOCAL PATCH").
rustysynth = { path = "vendor/rustysynth" }
rodio = { version = "0.22.2", features = ["playback"] } # Safe cross-platform audio playback
eframe = "0.36.1"                                       # GUI framework (re-exports egui)
anyhow = "1.0.104"
directories = "6.0.0"                                   # cross-platform config dir
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rustfft = "6.4.1"
mlua = { version = "0.12.1", features = ["lua54", "vendored"] }
rfd = "0.15"                                             # native folder-picker dialog
egui_dock = { version = "0.21.1", features = ["serde"] }      # dockable, rearrangeable tab layout
