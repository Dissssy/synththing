[package]
name = "synththing"
version = "0.4.0"
edition = "2024"
publish = false
license = "WTFPL"

[dependencies]
# Vendored copy of rustysynth 1.3.6 with local patches: repairing (instead of
# rejecting) soundfonts with out-of-range sample/loop points, channel muting
# and note inspection in the sequencer, copying channel state between
# synthesizers, and Clone on the synthesizer (snapshots to re-render from). Search vendor/rustysynth/src for "LOCAL PATCH".
rustysynth = { path = "vendor/rustysynth" }
rodio = { version = "0.22.2", features = ["playback"] } # Safe cross-platform audio playback
eframe = "0.36.1"                                       # GUI framework (re-exports egui)
anyhow = "1.0.104"
directories = "6.0.0"                                   # cross-platform config dir
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rustfft = "6.4.1"
mlua = { version = "0.12.1", features = ["lua54", "vendored"] }
rfd = "0.15"                                             # native folder-picker dialog
egui_dock = { version = "0.21.1", features = ["serde"] }      # dockable, rearrangeable tab layout
ureq = { version = "3.4", features = ["json"] }            # HTTPS for update checks/downloads
semver = "1.0"                                            # comparing release versions
self-replace = "1.5"                                      # swapping the running exe on update
sha2 = "0.11"                                             # verifying downloaded updates
log = "0.4"                                               # app-wide log (applog.rs)
notify = "8"                                              # live-refresh watched folders (watch.rs)
symphonia = { version = "0.5.5", default-features = false } # song info (song_info.rs); same copy and formats rodio uses
clap = { version = "4.6", features = ["derive"] }         # command-line arguments (cli.rs)
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }  # unpacking a downloaded ffmpeg (ffmpeg.rs)
stylua = { version = "2.5.2", default-features = false, features = ["lua54"] }
full_moon = { version = "2.2", default-features = false, features = ["lua54"] }
gilrs = "0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_SystemInformation"] }  # re-attach to the terminal for CLI use; local time for recording names
