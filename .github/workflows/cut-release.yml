# Cuts a release from GitHub: Actions > Cut release > Run workflow, picking
# patch, minor or major. It runs `cargo release <level> --execute` on one of
# our runners, as on a dev machine (docs/RELEASING.md): bumps Cargo.toml,
# turns CHANGELOG.md's Unreleased section into the version's, commits
# "Release X.Y.Z", tags vX.Y.Z and pushes both. The pushed tag starts
# release.yml. With "Dry run" ticked it only shows what it would do.
#
# The push needs the RELEASE_TOKEN secret: a fine-grained personal access
# token of a repository admin with Contents read and write on this
# repository. GITHUB_TOKEN won't do: it can't bypass master's ruleset, and
# a tag pushed with it doesn't start release.yml.
name: Cut release

on:
  workflow_dispatch:
    inputs:
      level:
        description: Version to bump
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: Dry run (show what it would do, push nothing)
        type: boolean
        default: false

permissions:
  contents: read
  checks: read

concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  release:
    # release.toml only allows master; this says so before anything runs.
    if: github.ref == 'refs/heads/master'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}  # see ci.yml
    steps:
      # Only a commit CI passed is released: wait for master's required
      # checks on this commit (they may still be running after a merge),
      # and stop if any of them failed.
      - name: Wait for CI on ${{ github.sha }}
        uses: actions/github-script@v8
        with:
          script: |
            const required = ['test', 'linux', 'android', 'docs'];
            const deadline = Date.now() + 90 * 60 * 1000;
            while (true) {
              const runs = await github.paginate(github.rest.checks.listForRef, {
                ...context.repo, ref: context.sha, per_page: 100,
              });
              // The newest run of each check (a re-run replaces the old one).
              const latest = {};
              for (const run of runs) {
                if (!required.includes(run.name)) continue;
                if (!latest[run.name] || run.id > latest[run.name].id) latest[run.name] = run;
              }
              const failed = required.filter(n => latest[n]?.status === 'completed' && latest[n].conclusion !== 'success');
              if (failed.length) core.setFailed(`CI failed on ${context.sha}: ${failed.join(', ')}`);
              if (failed.length) return;
              const waiting = required.filter(n => latest[n]?.status !== 'completed');
              if (!waiting.length) return core.info('CI passed');
              if (Date.now() > deadline) return core.setFailed(`CI still hasn't finished: ${waiting.join(', ')}`);
              core.info(`waiting for ${waiting.join(', ')}`);
              await new Promise(r => setTimeout(r, 30000));
            }

      # On master itself (not detached), with the tags cargo-release
      # compares against, and RELEASE_TOKEN as the push credential.
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          token: ${{ inputs.dry_run && github.token || secrets.RELEASE_TOKEN }}

      # Master moved on since CI passed: release what was checked, or nothing.
      - name: Master is still ${{ github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::master moved past $GITHUB_SHA; run this again for the new commit"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-release

      # The commit and tag are by whoever ran this.
      - name: Git identity
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR_ID+$GITHUB_ACTOR@users.noreply.github.com"

      - name: cargo release ${{ inputs.level }}
        env:
          LEVEL: ${{ inputs.level }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            cargo release "$LEVEL" --no-confirm
          else
            cargo release "$LEVEL" --execute --no-confirm
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
            echo "Released v$version: release.yml is building it." >> "$GITHUB_STEP_SUMMARY"
          fi
