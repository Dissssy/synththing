# Canary and branch test builds (docs/design/release-channels.md): every
# push to master rebuilds the `nightly` prerelease. A branch's
# `branch-<name>` prerelease is built when asked: Actions > Test builds >
# Run workflow, picking the branch (or `gh workflow run test-builds.yml
# --ref <branch>`), again for each update testers should get. Each is
# one rolling release: its tag moves to the new commit and its files are
# replaced, so only the newest build of each exists. Prereleases aren't
# what /releases/latest (the stable updater, the server's update script)
# or `gh release download` without a tag see. branch-cleanup.yml removes
# a branch's release when the branch is deleted.
#
# The release's name is the build's version (0.7.1-nightly.12) and its
# notes start with the commit, which is how the in-app updater tells
# builds apart.
name: Test builds

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which build this is: its channel, its number (commits since the release
  # in Cargo.toml) and the release it goes to.
  stamp:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.stamp.outputs.channel }}
      number: ${{ steps.stamp.outputs.number }}
      version: ${{ steps.stamp.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Stamp
        id: stamp
        run: |
          if [ "$GITHUB_REF_NAME" = master ]; then
            channel=nightly
            kind=nightly
          else
            # The branch's name, with anything a tag or URL would trip on
            # made a dash (mike/youtube: branch-mike-youtube).
            channel="branch-$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"
            kind=branch
          fi
          release=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if ! git rev-parse -q --verify "refs/tags/v$release" > /dev/null; then
            echo "::error::no tag v$release for Cargo.toml's version: test builds count commits from it"
            exit 1
          fi
          number=$(git rev-list --count "v$release..HEAD")
          IFS=. read -r major minor patch <<< "$release"
          version="$major.$minor.$((patch + 1))-$kind.$number"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "$channel: $version"

  windows:
    needs: stamp
    runs-on: windows-latest
    env:
      SYNTHTHING_CHANNEL: ${{ needs.stamp.outputs.channel }}
      SYNTHTHING_BUILD_NUMBER: ${{ needs.stamp.outputs.number }}
      SYNTHTHING_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --lib

      - name: Build
        run: cargo build --release

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: target/release/synththing.exe
          retention-days: 1

  # On an older Ubuntu, as releases are (glibc, see release.yml).
  linux:
    needs: stamp
    runs-on: ubuntu-22.04
    env:
      SYNTHTHING_CHANNEL: ${{ needs.stamp.outputs.channel }}
      SYNTHTHING_BUILD_NUMBER: ${{ needs.stamp.outputs.number }}
      SYNTHTHING_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libgtk-3-dev libxkbcommon-dev libwayland-dev

      - name: Test
        run: cargo test --lib

      - name: Build
        run: cargo build --release

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: target/release/synththing
          retention-days: 1

  # The Android app (docs/ANDROID.md), for the nightly only: a branch's
  # testers try its changes in the desktop build's mobile layout (View >
  # Mobile layout) instead. Published only with the release key.
  android:
    needs: stamp
    if: needs.stamp.outputs.channel == 'nightly'
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.apk.outputs.signed }}
    env:
      SYNTHTHING_CHANNEL: ${{ needs.stamp.outputs.channel }}
      SYNTHTHING_BUILD_NUMBER: ${{ needs.stamp.outputs.number }}
      SYNTHTHING_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - id: apk
        uses: ./.github/actions/android-apk
        with:
          version: ${{ needs.stamp.outputs.version }}
          keystore: ${{ secrets.ANDROID_KEYSTORE }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - if: steps.apk.outputs.signed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: synththing-android-arm64.apk
          retention-days: 1

  # The builds into the release at once, once they've passed: a release
  # never has one platform's build newer than another's. The Android app is
  # still experimental, so it failing (or being skipped) doesn't hold the
  # desktop builds back; the release then has no APK.
  publish:
    needs: [stamp, windows, linux, android]
    if: always() && needs.windows.result == 'success' && needs.linux.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CHANNEL: ${{ needs.stamp.outputs.channel }}
      VERSION: ${{ needs.stamp.outputs.version }}
      ANDROID: ${{ needs.android.result == 'success' && needs.android.outputs.signed == 'true' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # By name, each into its own folder (by name, the files go straight
      # in it).
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: windows

      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: linux

      - if: env.ANDROID == 'true'
        uses: actions/download-artifact@v8
        with:
          name: android
          path: android-apk

      - name: Publish
        run: |
          mv windows/synththing.exe synththing-windows-x86_64.exe
          mv linux/synththing synththing-linux-x86_64
          chmod +x synththing-linux-x86_64
          files=(synththing-windows-x86_64.exe synththing-linux-x86_64)
          if [ "$ANDROID" = true ]; then
            mv android-apk/synththing-android-arm64.apk .
            files+=(synththing-android-arm64.apk)
          fi

          # The notes: the commit first (the updater reads it), then who
          # and what. For a branch, its commits that master doesn't have.
          {
            echo "Commit: $GITHUB_SHA"
            echo
            if [ "$CHANNEL" = nightly ]; then
              echo "The newest commit on master, built by the test builds workflow. For testing: it may be broken."
            else
              echo "The newest commit on \`$GITHUB_REF_NAME\`, built by the test builds workflow. For testing: it may be broken, and its online features are off."
              echo
              echo "Commits not on master yet:"
              echo
              git log --format='- %h %s (%an)' "origin/master..$GITHUB_SHA"
            fi
          } > notes.md

          if gh release view "$CHANNEL" > /dev/null 2>&1; then
            # Move the tag to this commit, then replace the files.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$CHANNEL" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release edit "$CHANNEL" --title "$VERSION" --notes-file notes.md --prerelease --latest=false
            gh release upload "$CHANNEL" "${files[@]}" --clobber
            if [ "$ANDROID" != true ]; then
              # Not last build's APK with this build's notes: the app would
              # take it for this build.
              gh release delete-asset "$CHANNEL" synththing-android-arm64.apk --yes 2> /dev/null || true
            fi
          else
            gh release create "$CHANNEL" "${files[@]}" \
              --target "$GITHUB_SHA" --title "$VERSION" --notes-file notes.md --prerelease --latest=false
          fi
