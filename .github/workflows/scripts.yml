# Publishes the bundled scripts to the official script library whenever
# they change on master (docs/SERVER.md): each by its slug, signed with the
# official publisher key, so a changed script becomes its next version and
# apps get it through Update (the newest version their app can run).
# Unchanged scripts are left as they are; deleted ones stay on the server.
#
# Fast: nothing is built. The newest release's Linux binary publishes the
# scripts from this checkout (publish-bundled --dir); a script using
# something that release doesn't know (a function added since) is skipped,
# and goes out with the next release instead (release.yml's scripts job,
# which publishes with the binary it built).
#
# Needs the SYNTHTHING_PUBLISH_KEY secret (the official publisher's secret
# key, in hex); without it, this does nothing.
name: Publish scripts

on:
  push:
    branches: [master]
    paths:
      - "assets/visualizers/**"
  workflow_dispatch:

concurrency:
  group: publish-scripts
  cancel-in-progress: false

jobs:
  publish:
    # (The release binary is built on 22.04, for its glibc.)
    runs-on: ubuntu-22.04
    env:
      SYNTHTHING_PUBLISH_KEY: ${{ secrets.SYNTHTHING_PUBLISH_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Is there a key?
        id: key
        run: |
          if [ -n "$SYNTHTHING_PUBLISH_KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "No SYNTHTHING_PUBLISH_KEY secret: nothing to do."; fi

      - uses: actions/checkout@v5
        if: steps.key.outputs.present == 'true'

      - name: The newest release
        if: steps.key.outputs.present == 'true'
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern synththing-linux-x86_64
          chmod +x synththing-linux-x86_64
          # (It's the app's binary: it links the desktop libraries.)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-0 libasound2 libudev1 libxkbcommon0

      - name: Publish
        if: steps.key.outputs.present == 'true'
        run: |
          if ! ./synththing-linux-x86_64 publish-bundled --help | grep -q -- --dir; then
            echo "The newest release can't publish from a folder yet (that came after 0.4.1): the next release's scripts job publishes them."
            exit 0
          fi
          ./synththing-linux-x86_64 publish-bundled --dir assets/visualizers --server https://synththing.p51.nl
