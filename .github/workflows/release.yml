# Builds and publishes a release whenever a version tag is pushed (cargo
# release does that, see release.toml). The Windows exe is attached to the
# GitHub Release as synththing-windows-x86_64.exe and the Linux build
# (experimental, docs/LINUX.md) as synththing-linux-x86_64, and the Android
# app (experimental, docs/ANDROID.md) as synththing-android-arm64.apk: the
# names the in-app updater (src/updater.rs, ASSET_NAME) looks for. The Linux build
# also goes into the container image for servers and hubs
# (ghcr.io/<owner>/synththing, docs/DEPLOY.md, docs/HUB.md).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tag matches Cargo.toml version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "synththing") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
            exit 1
          fi

      - name: Test
        run: cargo test --lib

      - name: Build
        run: cargo build --release

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/release/synththing.exe synththing-windows-x86_64.exe
          # The notes are this version's section of CHANGELOG.md.
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## / { on = ($2 == v); next } on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" synththing-windows-x86_64.exe \
            --title "synththing $GITHUB_REF_NAME" \
            --notes-file notes.md

  # Built once the Windows job has published the release, and added to it.
  # On an older Ubuntu, so the binary runs on more distributions (it needs
  # a glibc at least as new as the one it's built against).
  linux:
    needs: windows
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      # Its own cache: by job name alone (the default) it would share CI's
      # `linux` job's, which holds only debug builds from a newer Ubuntu,
      # so every release build here started from scratch. Release and test
      # builds share it: the same build, on the same Ubuntu.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-release

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libgtk-3-dev libxkbcommon-dev libwayland-dev

      - name: Test
        run: cargo test --lib

      - name: Build
        run: cargo build --release

      - name: Add to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/release/synththing synththing-linux-x86_64
          chmod +x synththing-linux-x86_64
          gh release upload "$GITHUB_REF_NAME" synththing-linux-x86_64

  # The Android app (docs/ANDROID.md), added to the release once the
  # Windows job has published it. Only with the release key (the ANDROID_*
  # secrets): without it, this builds but adds nothing.
  android:
    needs: windows
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5

      - id: apk
        uses: ./.github/actions/android-apk
        with:
          keystore: ${{ secrets.ANDROID_KEYSTORE }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Add to the release
        if: steps.apk.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" synththing-android-arm64.apk

  # The website (deploy/website.Dockerfile): the front page and the docs
  # rendered by mdBook (book.toml), pushed to
  # ghcr.io/<owner>/synththing-website as :<version> and :latest, which
  # the official server's stack runs at synththing.p51.nl (docs/DEPLOY.md).
  website:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.4.40

      - name: Build
        run: |
          mdbook build
          mkdir site
          cp deploy/website/index.html site/
          cp -r target/book site/docs

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/synththing-website" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: site
          file: deploy/website.Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=synththing website and docs

  # The container image for servers and hubs (docs/DEPLOY.md, docs/HUB.md):
  # the Linux build just added, in deploy/release.Dockerfile's runtime,
  # pushed to ghcr.io/<owner>/synththing as :<version> and :latest. (It's
  # the whole app, desktop libraries and all, until there's a server-only
  # build: TODO.)
  docker:
    needs: linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Fetch the Linux build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern synththing-linux-x86_64 --dir deploy
          chmod +x deploy/synththing-linux-x86_64

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/synththing" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: deploy
          file: deploy/release.Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=synththing server and hub

  # The bundled scripts, published to the official script library with the
  # Linux build just made (it knows every function they use, so their
  # minimum app versions come out right). The server works those out too,
  # with its own binary, so this waits until it's running this release
  # (Watchtower pulls the new image within the hour). Without the
  # SYNTHTHING_PUBLISH_KEY secret, this does nothing.
  scripts:
    needs: linux
    runs-on: ubuntu-22.04
    env:
      SYNTHTHING_PUBLISH_KEY: ${{ secrets.SYNTHTHING_PUBLISH_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish
        run: |
          if [ -z "$SYNTHTHING_PUBLISH_KEY" ]; then echo "No SYNTHTHING_PUBLISH_KEY secret: nothing to do."; exit 0; fi
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern synththing-linux-x86_64
          chmod +x synththing-linux-x86_64
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-0 libasound2 libudev1 libxkbcommon0
          version="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 40); do
            running=$(curl -fsS https://synththing.p51.nl/api/v1/info | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' || true)
            if [ "$running" = "$version" ]; then break; fi
            echo "the server runs ${running:-?}, waiting for $version..."
            sleep 120
          done
          ./synththing-linux-x86_64 publish-bundled --server https://synththing.p51.nl
