# Builds and publishes a release whenever a version tag is pushed (cargo
# release does that, see release.toml). The Windows exe is attached to the
# GitHub Release as synththing-windows-x86_64.exe and the Linux build
# (experimental, docs/LINUX.md) as synththing-linux-x86_64, and the Android
# app (experimental, docs/ANDROID.md) as synththing-android-arm64.apk: the
# names the in-app updater (src/updater.rs, ASSET_NAME) looks for. The Linux build
# also goes into the container image for servers and hubs
# (ghcr.io/<owner>/synththing, docs/DEPLOY.md, docs/HUB.md).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Before anything is built: the tag is Cargo.toml's version and
  # CHANGELOG.md has a section for it (the release's notes).
  check:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}  # see ci.yml
    steps:
      - uses: actions/checkout@v5

      - name: Tag matches Cargo.toml version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
            exit 1
          fi

      - name: Notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## / { on = ($2 == v); next } on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: notes
          path: notes.md
          retention-days: 1

  # The three builds side by side, each into an artifact; publish puts
  # them in the release together. No tests here: CI (ci.yml) tests the
  # release commit when it's pushed to master.
  windows:
    needs: check
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}  # see ci.yml
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # On GitHub's runners only: ours keeps its builds on volumes.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: windows-release
          # A tag's cache is only readable by that same tag.
          save-if: false

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin

      # clang-cl, lld-link and llvm-rc, which cargo-xwin and winresource
      # (the icon, build.rs) cross-compile with.
      - name: LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm

      - name: Build
        run: |
          cargo xwin build --release --target x86_64-pc-windows-msvc
          cp "${CARGO_TARGET_DIR:-target}/x86_64-pc-windows-msvc/release/synththing.exe" .

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: synththing.exe
          retention-days: 1

  # On Ubuntu 22.04 (the runner's image, deploy/ci-runner.compose.yml), so
  # the binary runs on more distributions (it needs a glibc at least as new
  # as the one it's built against).
  linux:
    needs: check
    runs-on: ${{ vars.RUNNER || 'ubuntu-22.04' }}  # see ci.yml
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      # On GitHub's runners only: ours keeps its builds on volumes. Its own
      # cache: by job name alone (the default) it would share CI's `linux`
      # job's, which holds only debug builds from a newer Ubuntu.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: linux-release
          # A tag's cache is only readable by that same tag.
          save-if: false

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libgtk-3-dev libxkbcommon-dev libwayland-dev

      - name: Build
        run: |
          cargo build --release
          cp "${CARGO_TARGET_DIR:-target}/release/synththing" .

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: synththing
          retention-days: 1

  # The Android app (docs/ANDROID.md). Only with the release key (the
  # ANDROID_* secrets): without it, this builds but adds nothing.
  android:
    needs: check
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    outputs:
      signed: ${{ steps.apk.outputs.signed }}
    steps:
      - uses: actions/checkout@v5

      - id: apk
        uses: ./.github/actions/android-apk
        with:
          keystore: ${{ secrets.ANDROID_KEYSTORE }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - if: steps.apk.outputs.signed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: synththing-android-arm64.apk
          retention-days: 1

  # The release, with every build at once, once the desktop builds have
  # passed. The Android app is still experimental, so it failing (or being
  # skipped) doesn't hold the release back; the release then has no APK.
  publish:
    needs: [windows, linux, android]
    if: always() && needs.windows.result == 'success' && needs.linux.result == 'success'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}  # see ci.yml
    env:
      GH_TOKEN: ${{ github.token }}
      ANDROID: ${{ needs.android.result == 'success' && needs.android.outputs.signed == 'true' }}
    steps:
      # By name, each into its own folder (by name, the files go straight
      # in it).
      - uses: actions/download-artifact@v8
        with:
          name: notes
          path: notes

      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: windows

      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: linux

      - if: env.ANDROID == 'true'
        uses: actions/download-artifact@v8
        with:
          name: android
          path: android-apk

      - name: Publish release
        run: |
          mv windows/synththing.exe synththing-windows-x86_64.exe
          mv linux/synththing synththing-linux-x86_64
          chmod +x synththing-linux-x86_64
          files=(synththing-windows-x86_64.exe synththing-linux-x86_64)
          if [ "$ANDROID" = true ]; then
            mv android-apk/synththing-android-arm64.apk .
            files+=(synththing-android-arm64.apk)
          fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "synththing $GITHUB_REF_NAME" \
            --notes-file notes/notes.md

  # The website (deploy/website.Dockerfile): the front page and the docs
  # rendered by mdBook (book.toml), pushed to
  # ghcr.io/<owner>/synththing-website as :<version> and :latest, which
  # the official server's stack runs at synththing.p51.nl (docs/DEPLOY.md).
  website:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.4.40

      - name: Build
        run: |
          mdbook build
          mkdir site
          cp deploy/website/index.html site/
          cp -r target/book site/docs

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/synththing-website" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: site
          file: deploy/website.Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=synththing website and docs

  # The container image for servers and hubs (docs/DEPLOY.md, docs/HUB.md):
  # the release's Linux build, in deploy/release.Dockerfile's runtime,
  # pushed to ghcr.io/<owner>/synththing as :<version> and :latest. (It's
  # the whole app, desktop libraries and all, until there's a server-only
  # build: TODO.)
  docker:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: linux

      - name: The Linux build
        run: |
          mv linux/synththing deploy/synththing-linux-x86_64
          chmod +x deploy/synththing-linux-x86_64

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/synththing" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: deploy
          file: deploy/release.Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=synththing server and hub

  # The bundled scripts, published to the official script library with the
  # release's Linux build (it knows every function they use, so their
  # minimum app versions come out right). The server works those out too,
  # with its own binary, so this waits until it's running this release
  # (Watchtower pulls the new image within the hour). Without the
  # SYNTHTHING_PUBLISH_KEY secret, this does nothing.
  scripts:
    needs: publish
    runs-on: ubuntu-22.04
    env:
      SYNTHTHING_PUBLISH_KEY: ${{ secrets.SYNTHTHING_PUBLISH_KEY }}
    steps:
      - if: env.SYNTHTHING_PUBLISH_KEY != ''
        uses: actions/download-artifact@v8
        with:
          name: linux
          path: linux

      - name: Publish
        run: |
          if [ -z "$SYNTHTHING_PUBLISH_KEY" ]; then echo "No SYNTHTHING_PUBLISH_KEY secret: nothing to do."; exit 0; fi
          mv linux/synththing synththing-linux-x86_64
          chmod +x synththing-linux-x86_64
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-0 libasound2 libudev1 libxkbcommon0
          version="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 40); do
            running=$(curl -fsS https://synththing.p51.nl/api/v1/info | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' || true)
            if [ "$running" = "$version" ]; then break; fi
            echo "the server runs ${running:-?}, waiting for $version..."
            sleep 120
          done
          ./synththing-linux-x86_64 publish-bundled --server https://synththing.p51.nl
