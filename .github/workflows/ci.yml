# Builds and tests every push to master and every pull request, so a broken
# build shows up right away instead of when the next release tag is pushed.
# (Releases are release.yml's job.)
#
# The Linux jobs here and in test-builds.yml and branch-cleanup.yml run on
# the runner the RUNNER repository variable names (Settings > Secrets and
# variables > Actions > Variables), GitHub's ubuntu-latest without it. The
# runner is deploy/ci-runner.compose.yml. Pull requests from forks always
# stay on GitHub's runners: this repository is public, and a fork's code
# shouldn't run on a machine of ours. The Windows and Linux release and
# test builds (release.yml, test-builds.yml) run there too: Windows
# cross-compiled with cargo-xwin, Linux on the runner's Ubuntu 22.04 for
# its glibc. Only the Windows tests below stay on GitHub's runners: they
# have to run on Windows.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --lib

  # Linux (experimental, see docs/LINUX.md): it builds and its tests pass,
  # and this keeps it that way.
  linux:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      # The self-hosted runner keeps its builds on volumes instead.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libgtk-3-dev libxkbcommon-dev libwayland-dev

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test --lib

  # The docs website (book.toml) builds: every page in docs/SUMMARY.md is
  # there.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.4.40

      - name: Build
        run: mdbook build

  # The Android app (docs/ANDROID.md): it builds, so the desktop app's
  # changes don't quietly break it.
  android:
    # (Not for a fork's pull request: its code doesn't run on our runner.)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/android-apk

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: synththing-android-arm64.apk
          retention-days: 7
