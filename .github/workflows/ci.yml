# Builds and tests every push to master and every pull request, so a broken
# build shows up right away instead of when the next release tag is pushed.
# (Releases are release.yml's job.)
#
# The Linux jobs here and in test-builds.yml and branch-cleanup.yml run on
# the runner the RUNNER repository variable names (Settings > Secrets and
# variables > Actions > Variables), GitHub's ubuntu-latest without it. It
# needs git, gh, and apt with passwordless sudo. Pull requests from forks
# always stay on GitHub's runners: this repository is public, and a fork's
# code shouldn't run on a machine of ours. The Windows jobs, and the Linux
# builds pinned to ubuntu-22.04 for their glibc (release.yml,
# test-builds.yml), stay on GitHub's runners.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --bin synththing

  # Linux (experimental, see docs/LINUX.md): it builds and its tests pass,
  # and this keeps it that way.
  linux:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libgtk-3-dev libxkbcommon-dev libwayland-dev

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test --bin synththing
