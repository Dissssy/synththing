# Builds and tests every push to master and every pull request, so a broken
# build shows up right away instead of when the next release tag is pushed.
# (Releases are release.yml's job.)
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --bin synththing

  # Not a supported platform yet (see docs/LINUX.md): this shows how far a
  # Linux build gets, without failing the run when it doesn't.
  linux:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libgtk-3-dev libxkbcommon-dev libwayland-dev

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test --bin synththing
